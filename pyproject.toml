[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipengine"
version = "0.1.0"
description = "Short-form clips and on-brand social content for agency clients"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
clipengine = "clipengine.cli:main"
socialcrew = "socialcrew.cli:main"

[tool.setuptools]
packages = ["clipengine", "socialcrew"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
