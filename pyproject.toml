[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipengine"
version = "0.1.0"
description = "Turn long-form videos you own into short-form vertical clips"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
clipengine = "clipengine.cli:main"

[tool.setuptools]
packages = ["clipengine"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
